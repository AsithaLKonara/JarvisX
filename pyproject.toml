[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvisx-v2"
version = "2.0.0"
description = "JarvisX V2 - Intelligent AI Assistant with Custom-Trained 7B Model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "openai>=1.0.0",
    "langchain>=0.1.0",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
    "datasets>=2.15.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "safetensors>=0.4.0",
    "gradio_client>=0.10.1",
    "speechrecognition>=3.10.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.11",
    "googletrans>=4.0.0",
    "gtts>=2.5.0",
    "pygame>=2.5.0",
    "elevenlabs>=0.2.0",
    "vosk>=0.3.44",
    "scipy>=1.7.0",
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
    "obsws-python>=0.7.0",
    "sqlalchemy>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
jarvisx-cli = "cli.main:cli"
jvx = "cli.main:cli"
jarvisx = "cli.main:cli"

[tool.setuptools]
packages = ["cli", "core", "utils", "automation", "business_mode", "system_monitor", "integrations"]

